server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: false
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**
          filters:
            - StripPrefix=1
        - id: carrier-service
          uri: lb://carrier-service
          predicates:
            - Path=/api/carriers/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter
        - id: container-service
          uri: lb://container-service
          predicates:
            - Path=/api/containers/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter
        - id: yard-service
          uri: lb://yard-service
          predicates:
            - Path=/api/yard/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter
        - id: gate-service
          uri: lb://gate-service
          predicates:
            - Path=/api/gate/**
          filters:
            - StripPrefix=1
            - JwtAuthenticationFilter
      loadbalancer:
        retry:
          enabled: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

app:
  jwt:
    secret: ${HF_JWT_SECRET}
  cors:
    allowed-origins: ${HF_CORS_ALLOWED_ORIGINS:http://localhost:3000,http://127.0.0.1:3000}
