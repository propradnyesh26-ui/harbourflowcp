server:
  port: 8081

spring:
  application:
    name: auth-service
  datasource:
    url: ${NEON_JDBC_URL}
    username: ${NEON_DB_USERNAME}
    password: ${NEON_DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 5
      connection-timeout: 10000
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        default_schema: auth
        hbm2ddl:
          create_namespaces: true
        format_sql: false
    show-sql: false

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

app:
  jwt:
    secret: ${HF_JWT_SECRET}
    expiration: 86400000
